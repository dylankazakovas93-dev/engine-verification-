[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nq-frozen-engine"
version = "1.0.0"
description = "Verified implementation of the Frozen NQ Strategy Specification"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26",
  "pandas>=2.1",
  "tzdata>=2024.1",
]

[project.optional-dependencies]
test = ["pytest>=8.0"]

[project.scripts]
nq-frozen-backtest = "nq_frozen.cli:main"

[tool.setuptools]
packages = ["nq_frozen", "verifier"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
